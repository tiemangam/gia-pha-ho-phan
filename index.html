<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gia Phả Họ Phan</title>
<meta name="description" content="Gia phả họ Phan – thôn Mỹ Trang, xã Phổ Cường, Đức Phổ, Quảng Ngãi">
<meta name="theme-color" content="#3B5218">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gia Phả Họ Phan">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
html,body{margin:0;background:#FBF5E6;color:#3B5218;font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
#gp-boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px;z-index:50;background:#FBF5E6}
#gp-boot img{width:96px;height:96px;border-radius:22px;box-shadow:0 8px 20px rgba(59,82,24,.25)}
#gp-boot p{margin:0;font-size:18px;font-weight:600}
#gp-boot .dots::after{content:"";animation:d 1.2s steps(4) infinite}
@keyframes d{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
#gp-boot button{font:inherit;font-size:17px;font-weight:700;color:#fff;background:#5C9A1E;border:0;border-radius:14px;padding:12px 22px}
#gp-new{position:fixed;left:12px;right:12px;bottom:14px;z-index:9998;font:600 16px/1.35 -apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;background:#3B5218;border:0;border-radius:14px;padding:14px 16px;box-shadow:0 8px 20px rgba(0,0,0,.25)}
</style>
</head>
<body>
<div id="gp-boot"><img src="icon-180.png" alt=""><p class="dots">Đang mở gia phả</p></div>
<div id="gp-root"></div>
<script>
(function () {
  var API = 'https:\/\/script.google.com/macros/s/AKfycbzjkDzm2igiSSp5TsMazgXcFGolyPG5w3E6IdrNe_zb-KAHTZMUpAliXbR9Oezu7IMC/exec';
  var KEY = 'giapha-phan-app-v1';
  var here = location.href.split(/[?#]/)[0];
  var start = (new URLSearchParams(location.search).get('p') || '').replace(/[^0-9A-Za-z]/g, '');
  var t0 = Date.now(), touched = false, shown = false;
  ['pointerdown', 'keydown', 'touchstart'].forEach(function (ev) { addEventListener(ev, function () { touched = true; }, { once: true, passive: true }); });

  /* Góp ý gửi thẳng vào Google Sheet (thay cho google.script.run của bản Google) */
  var h = {};
  var run = {
    withSuccessHandler: function (f) { h.s = f; return run; },
    withFailureHandler: function (f) { h.f = f; return run; },
    guiGopY: function (g) {
      var s = h.s, f = h.f; h = {};
      fetch(API, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(g) })
        .then(function () { s && s(true); }, function (e) { f && f(e); });
    }
  };
  window.google = { script: { run: run } };

  function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

  function show(html) {
    html = html.replace(/window\.GP_URL=[^;]*;/, function () { return 'window.GP_URL=' + JSON.stringify(here) + ';'; })
               .replace(/window\.GP_START=[^;]*;/, function () { return 'window.GP_START=' + JSON.stringify(start) + ';'; });
    var root = document.getElementById('gp-root');
    root.innerHTML = html;
    var olds = root.querySelectorAll('script');
    for (var i = 0; i < olds.length; i++) {
      var o = olds[i], n = document.createElement('script');
      for (var j = 0; j < o.attributes.length; j++) n.setAttribute(o.attributes[j].name, o.attributes[j].value);
      n.text = o.text;
      o.parentNode.replaceChild(n, o);
    }
    var b = document.getElementById('gp-boot'); if (b) b.remove();
    document.title = 'Gia Phả Họ Phan';
    shown = true;
  }
  function failed() {
    var b = document.getElementById('gp-boot');
    if (b) b.innerHTML = '<img src="icon-180.png" alt=""><p>Chưa tải được gia phả.<br>Kiểm tra mạng rồi bấm thử lại.</p><button onclick="location.reload()">Thử lại</button>';
  }
  function newVersion() {
    if (document.getElementById('gp-new')) return;
    var btn = document.createElement('button'); btn.id = 'gp-new';
    btn.textContent = 'Gia phả vừa được cập nhật. Bấm vào đây để xem bản mới.';
    btn.onclick = function () { location.reload(); };
    document.body.appendChild(btn);
  }

  var cached = ls(KEY);
  if (cached) { try { show(cached); } catch (e) { shown = false; } }
  fetch(API + '?api=app', { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.text(); })
    .then(function (t) {
      if (t.indexOf('id="gp-data"') < 0) throw new Error('bad');
      if (t === cached) return;
      ls(KEY, t);
      if (!shown) show(t);
      else if (!touched && Date.now() - t0 < 6000) location.reload();
      else newVersion();
    })
    .catch(function () { if (!shown) failed(); });
})();
</script>
</body>
</html>
